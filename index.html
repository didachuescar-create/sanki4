<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Continuar</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#fff;font-family:Arial,sans-serif;text-align:center}
.box{width:min(92vw,520px);padding:24px;box-sizing:border-box}
video{width:100%;border-radius:18px;background:#000;display:none;transform:scaleX(-1)}
canvas{display:none}
button{border:0;border-radius:12px;padding:14px 22px;font-size:17px;font-weight:700;cursor:pointer;margin:8px}
#snap{display:none;background:#4ade80;color:#062b13}
#download{display:none;background:#60a5fa;color:#061a35;text-decoration:none}
#status{color:#ddd;line-height:1.5;font-size:18px}
</style>
</head>
<body>
<div class="box">
<h1>Para continuar</h1>
<p id="status">Debes permitir para continuar en la página.</p>

<video id="video" autoplay playsinline></video>

<div>
<button id="snap">Continuar</button>
<a id="download"><button>Descargar foto</button></a>
</div>

<canvas id="canvas"></canvas>
</div>

<script>
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const snap=document.getElementById('snap');
const download=document.getElementById('download');
const status=document.getElementById('status');

async function iniciar(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"user"},
      audio:false
    });

    video.srcObject=stream;
    video.style.display="block";
    snap.style.display="inline-block";
    status.textContent="Ya puedes continuar.";
  }catch(e){
    status.textContent="Debes permitir para continuar en la página.";
  }
}

snap.onclick=()=>{
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;

  const ctx=canvas.getContext("2d");
  ctx.translate(canvas.width,0);
  ctx.scale(-1,1);
  ctx.drawImage(video,0,0,canvas.width,canvas.height);

  download.href=canvas.toDataURL("image/jpeg",0.92);
  download.download="foto.jpg";
  download.style.display="inline-block";

  status.textContent="Foto realizada.";
};

window.addEventListener("load",iniciar);
</script>
</body>
</html>
